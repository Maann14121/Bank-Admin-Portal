
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bank Admin Portal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>Bank Admin Portal</h1>
    <p>Employee Management System</p>
  </header>

  <main>
    <section class="panel">
      <h2>Staff Directory</h2>

      <div class="search">
        <input id="firstSearch" placeholder="Search first name">
        <input id="lastSearch" placeholder="Search last name">
        <input id="locationSearch" placeholder="Search branch location">
      </div>

      <h3>Add New Employee</h3>

      <form id="employeeForm">
        <input id="firstName" placeholder="First name" required>
        <input id="lastName" placeholder="Last name" required>
        <input id="jobTitle" placeholder="Working title" required>
        <input id="email" type="email" placeholder="Email address" required>
        <input id="phone" placeholder="Contact number">
        <input id="location" placeholder="Branch location" required>

        <button type="submit">Add Employee</button>
      </form>

      <p id="message" role="status"></p>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Name</th>
              <th>Working Title</th>
              <th>Email</th>
              <th>Contact</th>
              <th>Branch</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="employeeList"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
<!-- Staff Access & Permissions -->
<section id="staffAccessSection">
  <h2>Staff Access & Permissions</h2>
  <p>Employee ki permissions dekhne aur update karne ke liye:</p>

  <label for="accessEmployee">Select Employee:</label>
  <select id="accessEmployee" required>
    <option value="">Select an employee</option>
  </select>

  <form id="permissionsForm">
    <label>
      <input type="checkbox" id="canViewCustomers" />
      View Customers
    </label>

    <label>
      <input type="checkbox" id="canManageAccounts" />
      Manage Accounts
    </label>

    <label>
      <input type="checkbox" id="canViewReports" />
      View Reports
    </label>

    <label>
      <input type="checkbox" id="canManageStaff" />
      Manage Staff
    </label>

    <label>
      <input type="checkbox" id="canAddEmployees" />
      Add Employees
    </label>

    <label>
      <input type="checkbox" id="canDeleteEmployees" />
      Delete Employees
    </label>

    <button type="submit">Save Permissions</button>
    <p id="permissionsMessage"></p>
  </form>
</section>
</html>
